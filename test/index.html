<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HabitX API Testing Suite</title>
  <script src="https://cdn.socket.io/4.8.4/socket.io.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0B0B0D;
      color: #F7F7F8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      font-size: 14px;
      padding: 24px;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 320px 1fr 440px;
      gap: 20px;
      height: calc(100vh - 48px);
    }

    @media (max-width: 1200px) {
      .container {
        grid-template-columns: 1fr;
        height: auto;
      }
    }

    .panel {
      background-color: #141416;
      border: 1px solid #28282D;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid #28282D;
      background-color: #1C1C20;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 600;
      color: #F7F7F8;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-body {
      padding: 16px;
      overflow-y: auto;
      flex: 1;
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .nav-item {
      padding: 10px 14px;
      background-color: transparent;
      border: 1px solid transparent;
      border-radius: 10px;
      color: #A3A3AB;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
      text-align: left;
      width: 100%;
    }

    .nav-item:hover {
      background-color: #1C1C20;
      color: #F7F7F8;
    }

    .nav-item.active {
      background-color: #2B2440;
      border-color: #A98AF7;
      color: #A98AF7;
      font-weight: 600;
    }

    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-get {
      background-color: #1C2B22;
      color: #55B887;
      border: 1px solid #55B887;
    }

    .badge-post {
      background-color: #2B2440;
      color: #A98AF7;
      border: 1px solid #A98AF7;
    }

    .badge-patch {
      background-color: #332818;
      color: #E5B35A;
      border: 1px solid #E5B35A;
    }

    .badge-delete {
      background-color: #331A1D;
      color: #E16B76;
      border: 1px solid #E16B76;
    }

    .auth-banner {
      background-color: #1C1C20;
      border: 1px solid #28282D;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .auth-status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #777780;
    }

    .status-dot.active {
      background-color: #55B887;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #A3A3AB;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      background-color: #1C1C20;
      border: 1px solid #28282D;
      border-radius: 10px;
      padding: 10px 12px;
      color: #F7F7F8;
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }

    .form-control:focus {
      border-color: #A98AF7;
    }

    textarea.form-control {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12px;
      min-height: 140px;
      resize: vertical;
      line-height: 1.4;
    }

    .btn {
      background-color: #A98AF7;
      color: #0B0B0D;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s ease;
    }

    .btn:hover {
      background-color: #8E6BE8;
    }

    .btn-secondary {
      background-color: #1C1C20;
      color: #F7F7F8;
      border: 1px solid #28282D;
    }

    .btn-secondary:hover {
      background-color: #28282D;
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 11px;
      border-radius: 8px;
    }

    .action-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .endpoint-card {
      background-color: #18181C;
      border: 1px solid #28282D;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .endpoint-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .endpoint-url {
      font-family: monospace;
      font-size: 13px;
      color: #F7F7F8;
    }

    .response-view {
      background-color: #0B0B0D;
      border: 1px solid #28282D;
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      color: #A3A3AB;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 480px;
    }

    .status-pill {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 600;
    }

    .status-200 {
      background-color: #1C2B22;
      color: #55B887;
    }

    .status-400 {
      background-color: #331A1D;
      color: #E16B76;
    }

    .socket-log {
      background-color: #0B0B0D;
      border: 1px solid #28282D;
      border-radius: 10px;
      padding: 12px;
      height: 220px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .socket-log-entry {
      color: #A3A3AB;
    }

    .socket-log-entry.event {
      color: #A98AF7;
    }

    .socket-log-entry.reaction {
      color: #E5B35A;
    }

    .quick-preset-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A98AF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
          HabitX API Tester
        </div>
        <button class="btn btn-secondary btn-sm" onclick="pingHealth()">Ping</button>
      </div>
      <div class="panel-body">
        <div class="auth-banner">
          <div class="auth-status">
            <span class="status-dot" id="auth-status-dot"></span>
            <span id="auth-status-text">Not Authenticated</span>
          </div>
          <div class="action-row">
            <button class="btn btn-sm" onclick="quickGuestAuth()">Guest Login</button>
            <button class="btn btn-secondary btn-sm" onclick="clearAuth()">Logout</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Base API URL</label>
          <input type="text" id="base-url" class="form-control" value="http://localhost:5000/api/v1">
        </div>

        <div class="form-group">
          <label class="form-label">Active JWT Bearer Token</label>
          <input type="text" id="jwt-token" class="form-control" placeholder="Bearer token..." oninput="updateTokenState()">
        </div>

        <div class="nav-list" id="endpoint-nav">
          <button class="nav-item active" onclick="switchSuite('auth')">
            <span>Authentication</span>
            <span class="badge badge-post">Auth</span>
          </button>
          <button class="nav-item" onclick="switchSuite('user')">
            <span>User & Profile</span>
            <span class="badge badge-get">User</span>
          </button>
          <button class="nav-item" onclick="switchSuite('focus')">
            <span>Focus Sessions</span>
            <span class="badge badge-post">Focus</span>
          </button>
          <button class="nav-item" onclick="switchSuite('blocking')">
            <span>App & Web Blocking</span>
            <span class="badge badge-patch">Block</span>
          </button>
          <button class="nav-item" onclick="switchSuite('habits')">
            <span>Habits & Streaks</span>
            <span class="badge badge-post">Habit</span>
          </button>
          <button class="nav-item" onclick="switchSuite('goals')">
            <span>Goals & Progress</span>
            <span class="badge badge-get">Goal</span>
          </button>
          <button class="nav-item" onclick="switchSuite('schedules')">
            <span>Schedule Planner</span>
            <span class="badge badge-get">Plan</span>
          </button>
          <button class="nav-item" onclick="switchSuite('rooms')">
            <span>Multiplayer Rooms</span>
            <span class="badge badge-post">Social</span>
          </button>
          <button class="nav-item" onclick="switchSuite('leaderboard')">
            <span>Leaderboards</span>
            <span class="badge badge-get">Rank</span>
          </button>
          <button class="nav-item" onclick="switchSuite('gamification')">
            <span>XP, Levels & Rewards</span>
            <span class="badge badge-post">XP</span>
          </button>
          <button class="nav-item" onclick="switchSuite('ai')">
            <span>AI Companion</span>
            <span class="badge badge-get">AI</span>
          </button>
          <button class="nav-item" onclick="switchSuite('screentime')">
            <span>Screen Time Analytics</span>
            <span class="badge badge-post">Stats</span>
          </button>
          <button class="nav-item" onclick="switchSuite('notifications')">
            <span>Notifications & Nudges</span>
            <span class="badge badge-get">Alert</span>
          </button>
          <button class="nav-item" onclick="switchSuite('music')">
            <span>Focus Music</span>
            <span class="badge badge-get">Audio</span>
          </button>
          <button class="nav-item" onclick="switchSuite('sync')">
            <span>Batch Offline Sync</span>
            <span class="badge badge-post">Sync</span>
          </button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title" id="suite-title">Authentication Endpoints</div>
      </div>
      <div class="panel-body" id="suite-content">
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">Response & Live WebSocket</div>
        <button class="btn btn-secondary btn-sm" onclick="clearResponse()">Clear</button>
      </div>
      <div class="panel-body">
        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" style="margin: 0;">API Response</label>
            <div id="response-meta" style="display: flex; gap: 8px; align-items: center;">
              <span id="response-status" class="status-pill status-200">READY</span>
              <span id="response-time" style="font-size: 11px; color: #777780;">0 ms</span>
            </div>
          </div>
          <div class="response-view" id="response-output">Ready. Select an endpoint or use Guest Login to authenticate.</div>
        </div>

        <div class="form-group" style="margin-top: 18px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <label class="form-label" style="margin: 0;">Socket.IO Multiplayer Focus Room</label>
            <div style="display: flex; align-items: center; gap: 6px;">
              <span class="status-dot" id="socket-status-dot"></span>
              <span id="socket-status" style="font-size: 11px; color: #777780;">Disconnected</span>
            </div>
          </div>

          <div class="action-row" style="margin-bottom: 8px;">
            <input type="text" id="socket-room-code" class="form-control" style="width: 130px;" value="GATE99" placeholder="Room Code">
            <button class="btn btn-sm" onclick="joinSocketRoom()">Join Room</button>
            <button class="btn btn-secondary btn-sm" onclick="leaveSocketRoom()">Leave</button>
            <button class="btn btn-secondary btn-sm" onclick="reconnectSocketManual()">Reconnect</button>
          </div>

          <div class="quick-preset-row">
            <button class="btn btn-secondary btn-sm" onclick="sendSocketReaction('🔥')">🔥 Fire</button>
            <button class="btn btn-secondary btn-sm" onclick="sendSocketReaction('👏')">👏 Clap</button>
            <button class="btn btn-secondary btn-sm" onclick="sendSocketReaction('❤️')">❤️ Love</button>
            <button class="btn btn-secondary btn-sm" onclick="sendSocketReaction('💯')">💯 100</button>
            <button class="btn btn-secondary btn-sm" onclick="sendSocketProgress(25)">+25m Focus</button>
          </div>

          <div class="socket-log" id="socket-log-output">
            <div class="socket-log-entry">Socket logs will stream here...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let socket = null;

    const suites = {
      auth: {
        title: 'Authentication & Account Management',
        render: () => `
          <div class="endpoint-card">
            <div class="endpoint-header">
              <span class="badge badge-post">POST</span>
              <span class="endpoint-url">/auth/guest</span>
            </div>
            <p style="color: #A3A3AB; font-size: 12px; margin-bottom: 10px;">Create a guest session instantly without credentials.</p>
            <button class="btn btn-sm" onclick="executeApi('POST', '/auth/guest', {})">Run Guest Login</button>
          </div>

          <div class="endpoint-card">
            <div class="endpoint-header">
              <span class="badge badge-post">POST</span>
              <span class="endpoint-url">/auth/register</span>
            </div>
            <div class="form-group">
              <label class="form-label">Name</label>
              <input type="text" id="reg-name" class="form-control" value="Pawan Focus">
            </div>
            <div class="form-group">
              <label class="form-label">Email</label>
              <input type="email" id="reg-email" class="form-control" value="test@habitx.app">
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input type="password" id="reg-password" class="form-control" value="Password123!">
            </div>
            <button class="btn btn-sm" onclick="runRegister()">Register User</button>
          </div>

          <div class="endpoint-card">
            <div class="endpoint-header">
              <span class="badge badge-post">POST</span>
              <span class="endpoint-url">/auth/verify-email</span>
            </div>
            <div class="form-group">
              <label class="form-label">Email</label>
              <input type="email" id="verify-email" class="form-control" value="test@habitx.app">
            </div>
            <div class="form-group">
              <label class="form-label">6-Digit OTP Code</label>
              <input type="text" id="verify-otp" class="form-control" placeholder="123456">
            </div>
            <button class="btn btn-sm" onclick="runVerifyEmail()">Verify Email</button>
          </div>

          <div class="endpoint-card">
            <div class="endpoint-header">
              <span class="badge badge-post">POST</span>
              <span class="endpoint-url">/auth/login</span>
            </div>
            <div class="form-group">
              <label class="form-label">Email</label>
              <input type="email" id="login-email" class="form-control" value="test@habitx.app">
            </div>
            <div class="form-group">
              <label class="form-label">Password</label>
              <input type="password" id="login-password" class="form-control" value="Password123!">
            </div>
            <button class="btn btn-sm" onclick="runLogin()">Login</button>
          </div>
        `
      },
      user: {
        title: 'User Profile & Preferences',
        render: () => `
          <div class="endpoint-card">
            <div class="endpoint-header">
              <span class="badge badge-get">GET</span>
              <span class="endpoint-url">/users/profile</span>
            </div>
            <p style="color: #A3A3AB; font-size: 12px; margin-bottom: 10px;">Fetch logged-in user profile, level progress & streak info.</p>
            <button class="btn btn-sm" onclick="executeApi('GET', '/users/profile')">Get Profile</button>
          </div>

          <div class="endpoint-card">
            <div class="endpoint-header">
              <span class="badge badge-patch">PATCH</span>
              <span class="endpoint-url">/users/preferences</span>
            </div>
            <div class="form-group">
              <label class="form-label">Preferences Payload</label>
              <textarea id="user-pref-body" class="form-control">{
  "theme": "dark",
  "defaultFocusDuration": 45,
  "soundPreset": "Rain",
  "strictModeDefault": false,
  "doomscrollProtection": {
    "instagramReels": true,
    "youtubeShorts": true,
    "facebookReels": true,
    "snapchatSpotlight": true
  }
}</textarea>
            </div>
            <button class="btn btn-sm" onclick="runUpdatePreferences()">Save Preferences</button>
          </div>

          <div class="endpoint-card">
            <div class="endpoint-header">
              <span class="badge badge-post">POST</span>
              <span class="endpoint-url">/users/onboarding</span>
            </div>
            <div class="form-group">
              <label class="form-label">Onboarding Setup</label>
              <textarea id="onboarding-body" class="form-control">{
  "goals": ["Study", "Reduce screen time", "Crack GATE"],
  "distractions": ["Instagram", "YouTube Shorts", "Reddit"],
  "focusTargetMinutes": 180,
  "bestFocusTime": "Evening (7 PM - 9 PM)"
}</textarea>
            </div>
            <button class="btn btn-sm" onclick="runSaveOnboarding()">Save Onboarding</button>
          </div>

          <div class="endpoint-card">
            <div class="endpoint-header">
              <span class="badge badge-get">GET</span>
              <span class="endpoint-url">/users/export</span>
            </div>
            <button class="btn btn-secondary btn-sm" onclick="executeApi('GET', '/users/export')">Export All Data</button>
          </div>
        `
      },
      focus: {
        title: 'Focus Sessions (Timer, Pomodoro, Deep Work)',
        render: () => `
          <div class="endpoint-card">
            <div class="endpoint-header">
              <span class="badge badge-post">POST</span>
              <span class="endpoint-url">/focus/start</span>
            </div>
            <div class="form-group">
              <label class="form-label">Start Session Config</label>
              <textarea id="focus-start-body" class="form-control">{
  "title": "Mathematics & Algorithms",
  "category": "Study",
  "mode": "timer",
  "plannedDurationMinutes": 45,
  "strictMode": false,
  "blockedApps": ["com.instagram.android", "com.google.android.youtube"],
  "soundTrack": "Rain"
}</textarea>
            </div>
            <button class="btn btn-sm" onclick="runStartFocus()">Start Focus Session</button>
          </div>

          <div class="endpoint-card">
            <div class="endpoint-header">
              <span class="badge badge-get">GET</span>
              <span class="endpoint-url">/focus/active</span>
            </div>
            <button class="btn btn-sm" onclick="executeApi('GET', '/focus/active')">Get Active Session</button>
          </div>

          <div class="endpoint-card">
            <div class="endpoint-header">
              <span class="badge badge-post">POST</span>
              <span class="endpoint-url">/focus/:id/finish</span>
            </div>
            <div class="form-group">
              <label class="form-label">Session ID</label>
              <input type="text" id="finish-session-id" class="form-control" placeholder="Session Mongo ObjectId">
            </div>
            <div class="form-group">
              <label class="form-label">Finish Payload</label>
              <textarea id="focus-finish-body" class="form-control">{
  "actualDurationSeconds": 2700,
  "interruptionsCount": 0,
  "notes": "Completed calculus chapter 4"
}</textarea>
            </div>
            <button class="btn btn-sm" onclick="runFinishFocus()">Finish Focus Session</button>
          </div>

          <div class="endpoint-card">
            <div class="endpoint-header">
              <span class="badge badge-get">GET</span>
              <span class="endpoint-url">/focus/summary</span>
            </div>
            <button class="btn btn-sm" onclick="executeApi('GET', '/focus/summary')">Get Today & Weekly Summary</button>
          </div>

          <div class="endpoint-card">
            <div class="endpoint-header">
              <span class="badge badge-get">GET</span>
              <span class="endpoint-url">/focus/history</span>
            </div>
            <button class="btn btn-secondary btn-sm" onclick="executeApi('GET', '/focus/history')">Get Focus History</button>
          </div>
        `
      },
      blocking: {
        title: 'App & Website Blocking Engine',
        render: () => `
          <div class="endpoint-card">
            <div class="endpoint-header">
              <span class="badge badge-get">GET</span>
              <span class="endpoint-url">/blocking/active-rules</span>
            </div>
            <p style="color: #A3A3AB; font-size: 12px; margin-bottom: 10px;">Returns active block sessions, doomscroll protection flags, and limits for native engine.</p>
            <button class="btn btn-sm" onclick="executeApi('GET', '/blocking/active-rules')">Get Active Rules</button>
          </div>

          <div class="endpoint-card">
            <div class="endpoint-header">
              <span class="badge badge-post">POST</span>
              <span class="endpoint-url">/blocking/apps</span>
            </div>
            <div class="form-group">
              <label class="form-label">App Rule Payload</label>
              <textarea id="app-rule-body" class="form-control">{
  "packageIdentifier": "com.instagram.android",
  "displayName": "Instagram",
  "category": "Social",
  "classification": "Distracting",
  "mode": "daily_limit",
  "dailyLimitMinutes": 45,
  "warningThresholdMinutes": 10,
  "enabled": true,
  "strict": false
}</textarea>
            </div>
            <button class="btn btn-sm" onclick="runSaveAppRule()">Save App Rule</button>
          </div>

          <div class="endpoint-card">
            <div class="endpoint-header">
              <span class="badge badge-post">POST</span>
              <span class="endpoint-url">/blocking/websites</span>
            </div>
            <div class="form-group">
              <label class="form-label">Website Rule Payload</label>
              <textarea id="website-rule-body" class="form-control">{
  "domain": "reddit.com",
  "type": "BLOCK",
  "category": "Social",
  "mode": "focus_only",
  "enabled": true,
  "strict": false
}</textarea>
            </div>
            <button class="btn btn-sm" onclick="runSaveWebsiteRule()">Save Website Rule</button>
          </div>

          <div class="endpoint-card">
            <div class="endpoint-header">

    async function executeApi(method, endpoint, body = null) {
      const baseUrl = document.getElementById('base-url').value.trim();
      const token = document.getElementById('jwt-token').value.trim();
      const url = `${baseUrl}${endpoint}`;

      const headers = {
        'Content-Type': 'application/json'
      };

      if (token) {
        headers['Authorization'] = token.startsWith('Bearer ') ? token : `Bearer ${token}`;
      }

      const options = { method, headers };
      if (body && (method === 'POST' || method === 'PATCH' || method === 'PUT')) {
        options.body = typeof body === 'string' ? body : JSON.stringify(body);
      }

      const startTime = performance.now();
      const responseOutput = document.getElementById('response-output');
      const responseStatus = document.getElementById('response-status');
      const responseTime = document.getElementById('response-time');

      responseOutput.textContent = 'Executing request...';

      try {
        const res = await fetch(url, options);
        const duration = Math.round(performance.now() - startTime);
        const data = await res.json();

        responseTime.textContent = `${duration} ms`;
        responseStatus.textContent = `${res.status} ${res.statusText || ''}`;

        if (res.ok) {
          responseStatus.className = 'status-pill status-200';
        } else {
          responseStatus.className = 'status-pill status-400';
        }

        responseOutput.textContent = JSON.stringify(data, null, 2);

        if (data?.data?.tokens?.accessToken) {
          saveToken(data.data.tokens.accessToken);
        } else if (data?.data?.token) {
          saveToken(data.data.token);
        }

        return data;
      } catch (err) {
        const duration = Math.round(performance.now() - startTime);
        responseTime.textContent = `${duration} ms`;
        responseStatus.textContent = 'ERROR';
        responseStatus.className = 'status-pill status-400';
        responseOutput.textContent = `Fetch Failed: ${err.message}\nMake sure backend is running on port 5000.`;
      }
    }

    function appendSocketLog(message, type = '') {
      const log = document.getElementById('socket-log-output');
      const entry = document.createElement('div');
      entry.className = `socket-log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      log.appendChild(entry);
      log.scrollTop = log.scrollHeight;
    }

    function connectSocket(token = '') {
      const baseUrl = document.getElementById('base-url').value.trim().replace('/api/v1', '');
      const rawToken = token || document.getElementById('jwt-token').value.trim();
      const cleanToken = rawToken.startsWith('Bearer ') ? rawToken.slice(7).trim() : rawToken;

      if (socket) {
        socket.disconnect();
      }

      appendSocketLog(`Connecting to WebSocket at ${baseUrl}...`);

      socket = io(baseUrl, {
        auth: { token: cleanToken },
        transports: ['websocket', 'polling'],
        reconnection: true,
        reconnectionAttempts: 5
      });

      socket.on('connect', () => {
        const dot = document.getElementById('socket-status-dot');
        const text = document.getElementById('socket-status');
        dot.classList.add('active');
        text.textContent = `Connected (${socket.id.slice(0, 6)})`;
        text.style.color = '#55B887';
        appendSocketLog(`WebSocket Connected successfully. Socket ID: ${socket.id}`, 'event');
      });

      socket.on('connection_established', (data) => {
        appendSocketLog(`Identity: ${data.user?.name || 'Explorer'}`, 'event');
      });

      socket.on('disconnect', (reason) => {
        const dot = document.getElementById('socket-status-dot');
        const text = document.getElementById('socket-status');
        dot.classList.remove('active');
        text.textContent = 'Disconnected';
        text.style.color = '#777780';
        appendSocketLog(`WebSocket Disconnected: ${reason}`);
      });

      socket.on('connect_error', (err) => {
        const dot = document.getElementById('socket-status-dot');
        const text = document.getElementById('socket-status');
        dot.classList.remove('active');
        text.textContent = 'Connection Error';
        text.style.color = '#E16B76';
        appendSocketLog(`Connection Error: ${err.message}. Make sure server is running.`, 'error');
      });

      socket.on('joined_success', (data) => {
        appendSocketLog(`Joined [${data.roomCode}] "${data.roomName}" (${data.participants?.length || 1} online)`, 'event');
      });

      socket.on('room_updated', (data) => {
        appendSocketLog(`Room [${data.roomCode}] update: ${data.totalParticipants} focusing now`, 'event');
      });

      socket.on('reaction_received', (data) => {
        appendSocketLog(`${data.userName} reacted: ${data.reaction}`, 'reaction');
      });

      socket.on('participant_progress_updated', (data) => {
        appendSocketLog(`${data.name} updated: ${data.focusedMinutes}m focused`, 'event');
      });
    }

    function reconnectSocketManual() {
      connectSocket();
    }

    function joinSocketRoom() {
      const code = document.getElementById('socket-room-code').value.trim().toUpperCase();
      if (!code) return alert('Enter room code');
      if (!socket || !socket.connected) {
        connectSocket();
      }
      socket.emit('join_room', { roomCode: code });
      appendSocketLog(`Sent join_room request for [${code}]`);
    }

    function leaveSocketRoom() {
      const code = document.getElementById('socket-room-code').value.trim().toUpperCase();
      if (socket && code) {
        socket.emit('leave_room', { roomCode: code });
        appendSocketLog(`Sent leave_room request for [${code}]`);
      }
    }

    function sendSocketReaction(reaction) {
      const code = document.getElementById('socket-room-code').value.trim().toUpperCase();
      if (!code) return alert('Enter a room code');
      if (socket && socket.connected) {
        socket.emit('send_reaction', { roomCode: code, reaction });
        appendSocketLog(`Sent reaction ${reaction} to [${code}]`, 'reaction');
      } else {
        appendSocketLog('Socket is not connected. Reconnecting...', 'error');
        connectSocket();
      }
    }

    function sendSocketProgress(mins) {
      const code = document.getElementById('socket-room-code').value.trim().toUpperCase();
      if (!code) return alert('Enter a room code');
      if (socket && socket.connected) {
        socket.emit('update_focus_progress', { roomCode: code, focusedMinutes: mins, status: 'focusing' });
        appendSocketLog(`Sent +${mins}m progress update to [${code}]`);
      } else {
        appendSocketLog('Socket is not connected. Reconnecting...', 'error');
        connectSocket();
      }
    }

    window.onload = () => {
      const savedToken = localStorage.getItem('habitx_test_token');
      if (savedToken) {
        document.getElementById('jwt-token').value = savedToken;
        updateTokenState();
      }
      connectSocket(savedToken || '');
      switchSuite('auth');
    };
  </script>
